<!-- 
1. Practice color formats: set a background using a hex code (#3b82f6), an rgb value (rgb(59, 130, 246)), 
    and an hsl value (hsl(217, 91%, 60%)). Pick a color from https://coolors.co and use it 3 ways.
2. Set up typography: choose a Google Font (https://fonts.google.com), import it, and apply it. Set 
    font-size in both px and rem — notice how px is absolute while rem scales with the root font size. 
    Set line-height to 1.5. Set font-weight to 400 and 700. See the difference.
3. Practice spacing: add padding to a box (space inside), margin (space outside), and understand the 
    difference. Create a card with 24px padding, 16px margin-bottom, and a 1px solid border.
4. Build a text-heavy page (heading, subheading, 2 paragraphs, a quote) styled with good typography. 
    Use Google Fonts, consistent spacing, and a limited color palette (2-3 colors). 
-->

<!DOCTYPE html>
<html>
    <head>
        <title>Colors, Typography and Spacing</title>
        <link rel="stylesheet" href="colorsTypographyAndSpacing.css">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Varela+Round&display=swap" rel="stylesheet">

    </head>
    <body>
        <div class="navbar">
            <nav>
                <h1>Hello, this page is about Colors, Typography and Spacing</h1>
            </nav>
            <a href="/css/2 Colors, Typography, and Spacing/textHeavyPage.html"><h1>About Me</h1></a>
        </div>
        

        <div class="themes">
            <article class="themes-heading">
                <h2>Please Press the dark theme you want to change the background with:</h2>
            </article>
        </div>
        <article class="cards">
            <div class="themelist">
                <h4>Color Palette:</h4>
                <div class="palette">
                    <div class="swatch" style="--c: #ffe2c9"></div>
                    <div class="swatch" style="--c: #ffbb7f"></div>
                    <div class="swatch" style="--c: #1F150C"></div>
                </div>
                <button class="button1" data-bg="#1F150C" data-accent="#ffbb7f" data-text="#ffe2c9">
                    Brown
                </button>
            </div>
            <div class="themelist">
                <h4>Color Palette:</h4>
                <div class="palette">
                    <div class="swatch" style="--c: #092328"></div>
                    <div class="swatch" style="--c: #38a378"></div>
                    <div class="swatch" style="--c: #aee7b7"></div>
                </div>
                <button class="button1" data-bg="#092328" data-accent="#38a378  " data-text="#aee7b7">
                    Green
                </button>
            </div>
            <div class="themelist">
                <h4>Color Palette:</h4>
                <div class="palette">
                    <div class="swatch" style="--c: #00041f"></div>
                    <div class="swatch" style="--c: #3459af"></div>
                    <div class="swatch" style="--c: #b0c8ff"></div>
                </div>
                <button class="button1" data-bg="#00041f" data-accent="#3459af" data-text="#b0c8ff">
                    Blue
                </button>
            </div>
        </article>    
        
        <script>
            const root = document.documentElement;
            document.querySelectorAll('button[data-bg]').forEach(btn => {
                btn.addEventListener('click', () => {
                    root.style.setProperty('--bg', btn.dataset.bg);
                    root.style.setProperty('--accent', btn.dataset.accent);
                    root.style.setProperty('--text', btn.dataset.text);
                });
            });
        </script>
    </body>
</html>

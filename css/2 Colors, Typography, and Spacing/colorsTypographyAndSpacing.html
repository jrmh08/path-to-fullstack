<!-- 
1. Practice color formats: set a background using a hex code (#3b82f6), an rgb value (rgb(59, 130, 246)), 
    and an hsl value (hsl(217, 91%, 60%)). Pick a color from https://coolors.co and use it 3 ways.
2. Set up typography: choose a Google Font (https://fonts.google.com), import it, and apply it. Set 
    font-size in both px and rem — notice how px is absolute while rem scales with the root font size. 
    Set line-height to 1.5. Set font-weight to 400 and 700. See the difference.
3. Practice spacing: add padding to a box (space inside), margin (space outside), and understand the 
    difference. Create a card with 24px padding, 16px margin-bottom, and a 1px solid border.
4. Build a text-heavy page (heading, subheading, 2 paragraphs, a quote) styled with good typography. 
    Use Google Fonts, consistent spacing, and a limited color palette (2-3 colors). 
-->

<!DOCTYPE html>
<html>
    <head>
        <title>Colors, Typography and Spacing</title>
        <meta charset="utf-8">
        <link rel="preconnect" href="https://googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Varela+Round&display=swap" rel="stylesheet">

        <style>
            nav {
                position: fixed;               /* or sticky, so the page scrolls under it */
                top: 12px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 100;

                display: flex;
                gap: 4px;
                padding: 6px;
                border-radius: 999px;

                background: rgba(255, 255, 255, 0.10);
                backdrop-filter: blur(16px) saturate(180%) brightness(1.1);
                -webkit-backdrop-filter: blur(16px) saturate(180%) brightness(1.1);
                border: 1px solid rgba(255, 255, 255, 0.22);
                box-shadow:
                    inset 0 1px 1px rgba(255, 255, 255, 0.55),
                    inset 0 -1px 1px rgba(255, 255, 255, 0.12),
                    0 10px 30px rgba(0, 0, 0, 0.25);
            }

            button {
                width: 10em;
                background-color: #ffbb7f; 
                border-radius: 999px;
                border: 1px solid rgba(255, 255, 255, 0.22);
                margin-top: 5cm;

                background: rgb(255 255 255 / .1);
                backdrop-filter: blur(16px) saturate(180%);
                border: 1px solid rgb(255 255 255 / .22);
                box-shadow: inset 0 1px 1px rgb(255 255 255 / .5), 0 10px 30px rgb(0 0 0 / .25);
            }

            button:hover {
                background-color: #856142;
            }

            #themes {
                display: flex;
                margin-top: 10em;
            }

            #themelist {
                margin: 0.5cm;
                width: 400px;
                height: 350px;
                border-radius: 50px;
                justify-items: center;
                text-align: center;
                background: rgba(255, 255, 255, 0.10);
                backdrop-filter: blur(16px) saturate(180%) brightness(1.1);
                -webkit-backdrop-filter: blur(16px) saturate(180%) brightness(1.1);
                border: 1px solid rgba(255, 255, 255, 0.22);
                box-shadow:
                    inset 0 1px 1px rgba(255, 255, 255, 0.55),
                    inset 0 -1px 1px rgba(255, 255, 255, 0.12),
                    0 10px 30px rgba(0, 0, 0, 0.25);
            }
        </style>
    </head>
    <body style="background-color: #1F150C; justify-items: center; font-family: 'Varela Round', sans-serif;">
        <nav>
            <h1 style="color: #ffbb7f; padding-left: 0.5em; padding-right: 0.5em;">Hello, this page is about Colors, Typography and Spacing</h1>
        </nav>

        <div id="themes">
            <article style="color: #ffbb7f; margin: auto;">
                <h2>Please Press the dark theme you want to change the background with:</h2>
            </article>
        </div>
        <article style="display: flex; color: #ffe2c9;">
            <div id="themelist">
                <h4>Color Palette:</h4>
                <button>
                    <h4>Brown</h4>
                </button>
            </div>
            <div id="themelist">
                <h4>Color Palette:</h4>
                <button>
                    <h4>Green</h4>
                </button>
            </div>
            <div id="themelist">
                <h4>Color Palette:</h4>
                <button>
                    <h4>Blue</h4>
                </button>
            </div>
        </article>                
    </body>
</html>

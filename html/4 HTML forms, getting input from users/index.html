<!-- 
- Build a login form with: an email input, a password input, and a submit button. Use proper <label> elements linked to each 
input with the 'for' attribute.
- Add these input types to a new form and observe how each behaves in the browser: text, email, password, number, checkbox, 
radio, select (dropdown), textarea.
- Add validation attributes to your email input: required and type='email' (type='email' validates the email format; minlength 
is not meaningful for email validation). Try submitting without filling it in — notice the browser blocks it and shows an error.
- Build a contact form with: name (required), email (required), subject (select with 3 options), message (textarea), and a 
submit button. Style it with basic CSS. -->

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>HTML Forms, getting input from users</title>
        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0 auto;
            }

            h1 {
                text-align: center;
                color: #333;
                font-size: 2em;
            }

            form {
                display: flex;
                flex-direction: column;
                width: 300px;
                margin: 0 auto;
            }

            input, textarea {
                padding: 0.5rem;
                border-radius: 0.5rem;
                border-style: solid;
            }
        </style>
    </head>
    <body>
        <h1>Welcome to my Login Form</h1>
        <form>
            <label for="email">Email: </label>
            <input type="email" id="email" name="email" required> <br> <br>

            <label for="password">Password: </label>
            <input type="password" id="password" name="password" required> <br> <br>

            <label for="subject">Subject: </label>
            <select name="subject" id="subject" style="cursor: pointer;">
                <option value="math">Math</option>
                <option value="history">History</option>
                <option value="science">Science</option>
            </select> <br> <br>

            <label for="message">Message: </label>
            <textarea name="message" id="message" cols="30" rows="10"></textarea> <br> <br>

            <input type="submit" value="Submit" style="cursor: pointer;" > 
        </form>
    </body>
</html>

 In CodePen, build a page with: your name as an h1, a short bio as a paragraph,

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>My First Webpage</title>
    </head>
    <body>

        <!-- the text above is using the paragraph element (p) -->

    </body>
</html>

<!-- 
- Create a link: <a href='https://github.com'>Visit GitHub</a>. Then make it open in a new tab by adding target='_blank'. 
Then make a link that jumps to another section of your page using an id.
- Add an image: <img src='https://placehold.co/300' alt='placeholder'>. Practice changing the src to a real image URL. 
Understand why the alt attribute matters for accessibility.
- Build an unordered list <ul> of your top 5 favourite apps. Then rebuild it as an ordered list <ol>. 
    Then create a nested list (a list inside a list).
- Build a simple navigation bar using a <nav> element containing a <ul> with 4 <li> items that are all anchor tag links. 
-->

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Links, Images and Lists</title>
    </head>
    <body>
        <a href="https://jrmhjn.vercel.app" target="_blank">This is my portfolio website</a><br><br>
        <img src="https://jrmhjn.vercel.app/assets/grad%20pic%204by5%20cropped-iARUT9Qh.jpg" style="width:15%; height:auto" alt="self">
        <ul>My Favorite Apps:
            <ol>
                <li>Facebook</li>
                <li>Threads</li>
                <li>LinkedIn</li>
                <li>Discord</li>
                <li>Instagram</li>
            </ol>
        </ul>

        <nav>
            <ul>
                <li><a href="https://github.com" target="_blank">GitHub</a></li>
                <li><a href="https://github.com" target="_blank">GitHub</a></li>
                <li><a href="https://github.com" target="_blank">GitHub</a></li>
                <li><a href="https://github.com" target="_blank">GitHub</a></li>
            </ul>
        </nav>

    </body>
</html>
